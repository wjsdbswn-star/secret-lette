<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f7f8f6">
<title>비밀편지가 도착했습니다</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#253b30;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:460px;margin:11vh auto 30px;padding:22px}section{border:1px solid #dce5de;background:white;padding:30px 23px;border-radius:24px;box-shadow:0 12px 30px #163a2110;text-align:center}
h1{font-size:24px;letter-spacing:-.05em;margin:9px 0 12px}p{font-size:15px;color:#5c7064;line-height:1.65}button{border:0;border-radius:13px;background:#276347;color:white;font-size:17px;font-weight:800;width:100%;padding:17px;cursor:pointer;margin:19px 0 8px}small{display:block;color:#7b887e;line-height:1.6}#error{color:#a93344}
</style></head><body><main><section>
<div style="font-size:42px">✉️</div><h1>비밀편지가 도착했어요</h1>
<p>이 편지는 <b>비밀편지 앱에서만</b> 읽을 수 있습니다. 설치된 앱을 열어 주세요.</p>
<button id="open" disabled>비밀편지 앱에서 열기</button>
<button id="copyLink" disabled style="background:#e9f1ed;color:#276347;margin-top:0">링크 복사 (앱에서 붙여넣기)</button>
<p id="error" role="status"></p>
<small>앱이 없는 경우 발신자에게 설치 방법을 문의해 주세요. 이 웹페이지는 편지를 읽거나 작성하지 않습니다.</small>
</section></main><script src="/landing.js" defer></script></body></html>
