name: 비밀편지 테스트 APK 자동 빌드
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tests/**'
      - 'scripts/patch_native.mjs'
      - 'scripts/check_android_update.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[web-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Android SDK 구성 (GitHub 러너에 사전 설치된 SDK 사용)
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: 보안 및 소멸 기능 자동 테스트
        working-directory: .
        run: npm test
      - name: 앱 패키지 설치
        run: npm install --no-audit --no-fund
      - name: 웹 앱 빌드
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WEB_BASE: ${{ vars.VITE_WEB_BASE }}
        run: npm run build
      - name: 안드로이드 프로젝트 생성
        run: npx cap add android
      - name: 앱 링크 등록
        working-directory: .
        run: |
          node scripts/patch_native.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const manifest=readFileSync('mobile/android/app/src/main/AndroidManifest.xml','utf8');
          for(const host of ['open','sent','compose'])assert.ok(manifest.includes('android:host="'+host+'"'),'Missing native app link: '+host);
          JS
      - name: 앱 파일 동기화
        run: npx cap sync android
      - name: 실제 APK 만들기
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../secret-letter-v10-14-test.apk
      - name: 기존 앱과 업데이트 서명·앱 ID·버전 비교
        id: update_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern secret-letter.apk --dir "$RUNNER_TEMP/secretletter-previous"
          node ../scripts/check_android_update.mjs --previous "$RUNNER_TEMP/secretletter-previous/secret-letter.apk" --next android/app/build/outputs/apk/debug/app-debug.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: APK 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 비밀편지-안드로이드-업데이트검사파일
          path: secret-letter-v10-14-test.apk
          if-no-files-found: error
      - name: 공개 APK 설치 링크 갱신 (시험용)
        if: steps.update_check.outputs.compatible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../secret-letter-v10-14-test.apk /tmp/secret-letter.apk
          if gh release view v10.14 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v10.14 /tmp/secret-letter.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create v10.14 /tmp/secret-letter.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "비밀편지 v10.14 Android 업데이트" --notes "작성 화면에서 1회 시간제한 또는 시간만 제한을 체크한 뒤 보내기를 누르면 다른 앱으로 공유합니다. 신고 자료는 접수 후 20일간 보관합니다. 직전 공개 APK와 앱 ID·서명·버전 호환 검사를 통과한 업데이트입니다."
          fi
      - name: 호환되지 않는 APK는 업데이트로 배포하지 않음
        if: steps.update_check.outputs.compatible != 'true'
        run: |
          echo '기존 앱과 서명이 달라 업데이트 배포를 중단했습니다. 기존 앱과 데이터를 지우지 마세요. 이전 APK의 원래 서명키가 필요합니다.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

