name: 비밀편지 테스트 APK 자동 빌드
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/patch_native.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4
      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Android SDK 구성 (GitHub 러너에 사전 설치된 SDK 사용)
        run: |
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: 보안 및 소멸 기능 자동 테스트
        working-directory: .
        run: npm test
      - name: 앱 패키지 설치
        run: npm install --no-audit --no-fund
      - name: 웹 앱 빌드
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WEB_BASE: ${{ vars.VITE_WEB_BASE }}
        run: npm run build
      - name: 안드로이드 프로젝트 생성
        run: npx cap add android
      - name: 앱 링크 등록
        run: node ../scripts/patch_native.mjs
      - name: 앱 파일 동기화
        run: npx cap sync android
      - name: 실제 APK 만들기
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../secret-letter-v10-test.apk
      - name: APK 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 비밀편지-안드로이드-설치파일
          path: secret-letter-v10-test.apk
          if-no-files-found: error
