name: Android trial without removing the previous app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/patch_native.mjs'
      - '.github/workflows/android-trial.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[web-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Test letter security and expiry
        working-directory: .
        run: npm test
      - name: Install and build the app
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WEB_BASE: ${{ vars.VITE_WEB_BASE }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Give the new trial a separate identity
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('capacitor.config.json','utf8'));
          // A fresh ID allows testing without uninstalling or overwriting prototype data.
          config.appId='com.secretletter.app';
          config.appName='비밀편지 새버전';
          writeFileSync('capacitor.config.json',JSON.stringify(config,null,2)+'\n');
          JS
          npx cap add android
      - name: Register app links and app version
        working-directory: .
        run: |
          node scripts/patch_native.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const manifest=readFileSync('mobile/android/app/src/main/AndroidManifest.xml','utf8');
          for(const host of ['open','sent','compose'])assert.ok(manifest.includes('android:host="'+host+'"'));
          const gradle=readFileSync('mobile/android/app/build.gradle','utf8');
          assert.match(gradle,/applicationId\s+"com\.secretletter\.app"/);
          JS
      - name: Sync native Share plugin
        run: npx cap sync android
      - name: Build unsigned release
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Align APK and prepare files for private offline signing
        run: |
          mkdir -p ../android-unsigned
          SDK_BUILD="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_BUILD/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk ../android-unsigned/secret-letter-unsigned.apk
          "$SDK_BUILD/zipalign" -c -P 16 -v 4 ../android-unsigned/secret-letter-unsigned.apk
          cp "$SDK_BUILD/lib/apksigner.jar" ../android-unsigned/apksigner.jar
          cp "$SDK_BUILD/aapt2" ../android-unsigned/aapt2
          "$SDK_BUILD/aapt2" dump badging ../android-unsigned/secret-letter-unsigned.apk > ../android-unsigned/apk-badging.txt
          sha256sum ../android-unsigned/secret-letter-unsigned.apk > ../android-unsigned/unsigned-sha256.txt
          printf '%s\n' '${{ github.sha }}' > ../android-unsigned/source-commit.txt
          test -s ../android-unsigned/secret-letter-unsigned.apk
      - name: Upload unsigned APK for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: secret-letter-android-unsigned-for-private-signing
          path: android-unsigned/
          if-no-files-found: error
          retention-days: 14
